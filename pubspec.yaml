name: kompak_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Core
  get_it: ^9.2.1
  injectable: ^3.0.0
  auto_route: ^11.1.0
  flutter_bloc: ^9.1.1
  collection: ^1.19.1
  json_annotation: ^4.12.0
  equatable: ^2.1.0
  # Utils
  intl: ^0.20.3
  camera: ^0.12.0+2
  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  # Network
  dio: ^5.10.0
  image_picker: ^1.2.3
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  # Flutter
  flutter_test: 
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code Generation
  build_runner: ^2.15.0
  injectable_generator: ^3.1.0
  auto_route_generator: ^10.6.0
  json_serializable: ^6.14.0
  # Icons
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_blue.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_blue.png"

flutter_native_splash:
  color: "#2563EB"
  image: "assets/images/brand_logo.png"
  android_12:
    image: "assets/images/app_icon_white.png"
    icon_background_color: "#2563EB"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
